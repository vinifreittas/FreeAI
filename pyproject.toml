[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "FreeAI"
dynamic = ["version"]
description = "Pre-configured, intelligent API Gateway and LLM Router for free and freemium AI model providers"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vinicius Freittas", email = "vinifreitas6465@gmail.com" }]
keywords = ["ai", "llm", "api-gateway", "router", "litellm", "fastapi", "openai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "litellm>=1.104.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.65.0",
    "typer>=0.15.0",
]

[project.scripts]
freeai = "freeai.main:app"

[project.urls]
Homepage = "https://github.com/vinifreittas/FreeAI"
Bug-Tracker = "https://github.com/vinifreittas/FreeAI/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "deadcode>=2.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "agno>=3.1.1",
]

# --- Hatch Configuration ---

[tool.hatch.build.targets.wheel]
packages = ["src/freeai"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# --- Pytest Configuration ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

# --- Third-Party Tools ---

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (syntax modernization)
    "B",   # flake8-bugbear (bug prevention)
    "SIM", # flake8-simplify (code simplification)
    "N",   # naming convention
    "RUF", # ruff specific rules
]

ignore = [
    "E501", # Line too long (Ruff's formatter handles this well anyway)
    "B008", # Function call in argument default (FastAPI Depends/Security pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
