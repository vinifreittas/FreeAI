[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "FreeAI"
dynamic = ["version"]
description = "Coming Soon..."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Vinicius Freittas", email = "vinifreitas6465@gmail.com" }
]
keywords = ["AI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", 
    "Operating System :: OS Independent"
]
dependencies = [
    "fastapi",
    "uvicorn",
    "litellm",
    "pydantic-settings",
    "typer",
    "pyyaml",
    "python-dotenv",
    "rich",
]

[project.scripts]
freeai = "freeai.__main__:main"

[project.urls]
Homepage = "https://github.com/vinifreittas/FreeAI"
Bug-Tracker = "https://github.com/vinifreittas/FreeAI/issues"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "deadcode",
    "pytest",
    "agno"
]

# --- Hatch Configuration ---

[tool.hatch.build.targets.wheel]
packages = ["src/freeai"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# --- Third-Party Tools ---

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (syntax modernization)
    "B",    # flake8-bugbear (bug prevention)
    "SIM",  # flake8-simplify (code simplification)
    "N",    # naming convention
    "RUF",  # ruff specific rules
]

ignore = [
    "E501", # Line too long (Ruff's formatter handles this well anyway)
    "B008", # Function call in argument default (FastAPI Depends/Security pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"