# FreeAI — Model Configuration & Fallback Topology

# =========================================================================
# METADATA & GLOBAL SETTINGS
# =========================================================================
meta:
  version: "1.0.0"
  environment: "production"
  updated_at: "2026-09-12"

router_settings:
  num_retries: 2
  minute_cooldown_seconds: 60
  daily_cooldown_seconds: 86400

# =========================================================================
# PROVIDERS & SPECIFIC MODELS
# =========================================================================
providers:
  - id: "gemini"
    display_name: "Google AI Studio"
    website_url: "https://aistudio.google.com/"
    api_key_env: "GOOGLE_API_KEY"
    models:
      - id: "gemini-3.5-flash"
        remote_model: "gemini-3.5-flash"
        types: ["chat"]

      - id: "gemini-3.1-flash-lite"
        remote_model: "gemini-3.1-flash-lite"
        types: ["chat"]

      - id: "gemini-3-flash"
        remote_model: "gemini-3-flash-preview"
        types: ["chat"]

      - id: "gemma-4-31b"
        remote_model: "gemma-4-31b-it"
        types: ["chat"]

      - id: "gemma-4-26b"
        remote_model: "gemma-4-26b-a4b-it"
        types: ["chat"]

      - id: "gemini-embedding-2"
        remote_model: "gemini-embedding-2"
        types: ["embedding"]

      - id: "gemini-3.1-flash-tts"
        remote_model: "gemini-3.1-flash-tts"
        types: ["tts"]

      - id: "gemini-2.5-flash-tts"
        remote_model: "gemini-2.5-flash-tts"
        types: ["tts"]

  - id: "groq"
    display_name: "Groq Cloud"
    website_url: "https://groq.com/"
    api_key_env: "GROQ_API_KEY"
    models:
      - id: "groq-llama-3.3-70b"
        remote_model: "llama-3.3-70b-versatile"
        types: ["chat"]

      - id: "groq-compound"
        remote_model: "groq/compound"
        types: ["chat"]

      - id: "groq-compound-mini"
        remote_model: "groq/compound-mini"
        types: ["chat"]

      - id: "groq-gpt-oss-120b"
        remote_model: "openai/gpt-oss-120b"
        types: ["chat"]

      - id: "groq-gpt-oss-20b"
        remote_model: "openai/gpt-oss-20b"
        types: ["chat"]

      - id: "groq-qwen3.6-27b"
        remote_model: "qwen/qwen3.6-27b"
        types: ["chat"]

      - id: "whisper-large-v3"
        remote_model: "whisper-large-v3"
        types: ["stt"]

      - id: "whisper-large-v3-turbo"
        remote_model: "whisper-large-v3-turbo"
        types: ["stt"]

  - id: "openrouter"
    display_name: "OpenRouter"
    website_url: "https://openrouter.ai/"
    api_key_env: "OPENROUTER_API_KEY"
    models:
      - id: "openrouter-gpt-oss-120b"
        remote_model: "openai/gpt-oss-120b:free"
        types: ["chat"]

      - id: "openrouter-gpt-oss-20b"
        remote_model: "openai/gpt-oss-20b:free"
        types: ["chat"]

      - id: "openrouter-qwen3-coder"
        remote_model: "qwen/qwen3-coder:free"
        types: ["chat", "code"]

      - id: "openrouter-qwen3-next-80b"
        remote_model: "qwen/qwen3-next-80b-a3b-instruct:free"
        types: ["chat"]

      - id: "openrouter-nemotron-3-super-120b"
        remote_model: "nvidia/nemotron-3-super-120b-a12b:free"
        types: ["chat"]

      - id: "openrouter-nemotron-3-nano-reasoning"
        remote_model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
        types: ["reasoning"]

      - id: "openrouter-nemotron-3-nano"
        remote_model: "nvidia/nemotron-3-nano-30b-a3b:free"
        types: ["chat"]

      - id: "openrouter-laguna-m.1"
        remote_model: "poolside/laguna-m.1:free"
        types: ["chat"]

      - id: "openrouter-llama-nemotron-embed"
        remote_model: "nvidia/llama-nemotron-embed-vl-1b-v2:free"
        types: ["embedding"]

# =========================================================================
# VIRTUAL ROUTER ALIASES (Application Shortcuts)
# =========================================================================
aliases:
  - alias: "chat"
    description: "Modelo padrão de chat geral de alta velocidade"
    models_types_to_chain: ["chat"]

  - alias: "coder"
    description: "Geração e leitura de código"
    models_types_to_chain: ["code"]

  - alias: "embed"
    description: "Geração de embeddings de texto"
    models_types_to_chain: ["embedding"]

  - alias: "tts"
    description: "Conversão de texto para áudio (Text-to-Speech)"
    models_types_to_chain: ["tts"]

  - alias: "stt"
    description: "Transcrição de áudio para texto (Speech-to-Text)"
    models_types_to_chain: ["stt"]
